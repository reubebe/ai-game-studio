[package]
name = "game-studio"
version = "0.1.0"
description = "Universal AI Game Studio desktop application"
authors = ["Universal AI Game Studio contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "game_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON objects keep their key order. Model providers read schemas in order, and sorting
# them (serde_json's default) made local models choose an object id before choosing the operation.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "charset"] }
sha2 = "0.11"
# Poly Haven publishes an MD5 for every file; downloads are checked against it (and hashed with SHA-256 for the asset index).
md-5 = "0.11"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# Native input and web view snapshots for the real-app self-test (src/native.rs). Tao and wry already
# depend on these crates; only the listed features are added.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKUIDelegate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
