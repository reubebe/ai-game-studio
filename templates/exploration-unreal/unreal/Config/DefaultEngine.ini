; Generated by Universal AI Game Studio. The level is built at runtime by AStudioGameMode from
; Content/GameStudioData/world.json, so the game starts on the engine's empty Entry map.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/StudioValley.StudioGameMode

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False

[/Script/MacTargetPlatform.XcodeProjectSettings]
; Unreal signs packaged Mac games with the App Sandbox, so each project gets its own identifier
; (and its own container for logs and screenshots).
CodeSigningPrefix=com.gamestudio
BundleIdentifier={{BUNDLE_ID}}

[/Script/MacTargetPlatform.MacTargetSettings]
; SM5 only. Unreal 5.8 falls back to SM5 on some Apple silicon Macs, and a build cooked
; without SM5 shaders then hangs at startup. SM5 runs on every Apple silicon Mac.
!TargetedRHIs=ClearArray
+TargetedRHIs=SF_METAL_SM5
